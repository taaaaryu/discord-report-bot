[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-meeting-minutes-bot"
version = "0.1.0"
description = "Discord voice meeting recorder and markdown minutes generator"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.4.0",
  "discord-ext-voice-recv>=0.5.2a179",
  "PyNaCl>=1.5.0",
  "openai>=1.58.0",
  "google-genai>=0.6.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
